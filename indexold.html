function live(){if(p().stage==='Home'){toast('This visit is closed. Admit a new visit from rescue dispatch.');return false}return true}
function admitted(){if(!live())return false;if(p().stage==='Intake'){toast('Use Admit & begin examination first.');return false}return true}
function findings(i){let b=c(),a=p();if(b.specialist&&i>=4)return [b.name+' has reduced food interest in this scenario.',b.name+' benefits from protected low-stress observation.','Specialist assessment is needed before activity or release decisions.','Rescue history: '+b.story][i-4];return i<4?b.clues[i]:[b.name+' shows cautious interest in the food or foraging station.',b.name+' settles when the surroundings are quiet and screened.',b.name+' needs a controlled '+(['owl','eagle','heron'].includes(b.kind)?'perch and wing':'walking and balance')+' assessment before returning home.','Rescue history: '+b.story][i-4]}
function testResult(i){if(c().testResults)return c().testResults[i];return i===0?c().test:i===1?'Movement assessment: the visible restriction explains the hesitant movement; reassess after care.':'Habitat audit: choose the '+c().region.toLowerCase()+' habitat, prepare the resting area, and reduce disturbance.'}
function nextStep(){let a=p();if(a.stage==='Home')return 'Visit complete. Review the records or admit another rescue.';if(a.stage==='Intake')return 'Admit this patient. Routine and urgent arrivals can both begin examination.';if(a.triage==='Urgent'&&!a.stabilized)return 'Complete the quiet stabilization step before continuing the examination.';if(a.crisis)return 'A recovery concern needs reassessment. Open Recovery and respond to the concern.';if(a.checks.length<8)return 'Examine the patient: '+a.checks.length+'/8 checks complete.';if(a.tests.length<3)return 'Investigate with all three assessments: '+a.tests.length+'/3 complete.';if(a.diagnosis!==rightDx())return 'Choose the explanation supported by the findings and tests.';if(!a.habitatReady)return 'Assign and prepare the correct '+c().region.toLowerCase()+' habitat in Care.';if(a.care.length<3)return 'Complete the species-specific care plan: '+a.care.length+'/3 actions.';if(!a.enrichment)return 'Prepare the species-specific comfort and enrichment activity.';if(a.round<5)return 'Recovery needs five rounds. Check all four observation areas, then advance each round.';return c().specialist?'Prepare the continuing specialist-care handover. These rounds do not establish a cure or release fitness.':'Recovery is steady. Write a handover and send home when ready.'}
function selectPatient(i){if(!state.patients[i])return;state.selected=i;dispatch=false;tab=p().stage==='Home'?'Records':p().stage==='Recovery'?'Recovery':p().stage==='Intake'?'Intake':'Examine';save();render()}
function admitPatient(){if(p().stage==='Home'){admitCase(p().case);return}dispatch=false;setMobileNotes(false);if(p().stage==='Intake'){p().stage='Examine';tab='Examine';journal('ADMITTED: '+c().species+' · '+p().triage+' arrival · '+c().location+'.')}else tab=currentTask().tab||'Examine';render();toast(c().name+' is admitted. Follow the Next step button above.')}
function check(i){if(!admitted())return;if(p().triage==='Urgent'&&!p().stabilized){toast('Complete quiet stabilization first.');return}if(!p().checks.includes(i)){p().checks.push(i);journal('Finding: '+findings(i))}capture(findings(i));render()}
function runTest(i){if(!admitted())return;if(p().checks.length<8){toast('Complete the eight examination checks first.');return}if(!p().tests.includes(i)){p().tests.push(i);p().tested=true;journal(testNames()[i]+': '+testResult(i))}capture(testResult(i));render()}
function diagnose(i){if(!admitted())return;if(p().tests.length<3){toast('Run all three assessments first.');return}p().diagnosis=i;journal('Working explanation: '+c().dx[i]);render();toast(i===rightDx()?'The evidence supports this explanation.':'Review the confirmed finding; this explanation does not account for it.')}
function chooseHabitat(){if(!admitted())return;let choice=$('habitatSelect').value;p().habitat=choice;p().habitatReady=choice===c().region;journal('Habitat assignment: '+choice+(p().habitatReady?' — appropriate care space prepared.':' — does not match this patient’s recovery needs.'));render();toast(p().habitatReady?'Care habitat prepared.':'Choose the '+c().region.toLowerCase()+' care habitat.')}
function care(i){if(!admitted())return;let a=p();if(a.checks.length<8||a.tests.length<3||a.diagnosis!==rightDx()||!a.habitatReady){toast('Complete the investigation and prepare the matching habitat first.');return}if(a.care.includes(i)){toast('This action is already complete.');return}a.care.push(i);a.health=Math.min(100,a.health+10);a.needs.stress=Math.max(0,a.needs.stress-8);journal('Care: '+c().care[i]);capture('Care response: '+c().care[i]+' completed; continue observing '+c().name+'.');if(a.care.length===3){a.stage='Recovery';a.crisisAt=1+(a.case%3)}save();render()}
function comfort(){if(!admitted())return;p().needs.stress=Math.max(5,p().needs.stress-5);journal('Comfort round: quiet screen, clean resting place and calm observation.');capture('Bedside comfort: '+c().name+' settles in the '+c().region.toLowerCase()+' habitat.');render()}
function enrichmentText(){if(c().specialist)return 'Prepare the specialist-approved resting environment and observation activity';return {fox:'Prepare a scent trail beside a covered den',deer:'Offer a leafy browse station behind the screen',owl:'Arrange a low quiet perch and visual shelter',hedgehog:'Arrange a leaf tunnel and sheltered foraging tray',bear:'Prepare a low log and a gentle food puzzle',eagle:'Arrange a broad perch with a clear glide lane',beaver:'Prepare a branch-carrying area beside the bank',heron:'Arrange a shallow-water foraging zone',goat:'Prepare a low practice slope with secure footing',meerkat:'Arrange a sandy foraging tray and lookout mound',koala:'Prepare a broad branch fork and quiet browse area',otter:'Prepare a bank-side food puzzle and shallow swim lane'}[c().kind]}
function enrich(){if(!admitted())return;if(p().care.length<3){toast('Complete initial care before enrichment.');return}if(!p().enrichment){p().enrichment=true;journal('Enrichment: '+enrichmentText());capture('Enrichment prepared: '+enrichmentText())}render()}
const observationNames=['Movement','Appetite','Rest & stress','Habitat use'];
function observationText(i){let a=p(),b=c(),n=Math.min(2,Math.floor(a.round/2));if(b.specialist)return i===0?b.obs[n]:['','Food intake and appetite are recorded for the specialist.','Rest and comfort are compared with the preceding observation.','The protected habitat and access are checked without assuming fitness for release.'][i];return i===0?b.obs[n]:i===1?(a.round<2?b.name+' shows cautious food interest; continue quiet observations.':b.name+' accepts the species-appropriate food or foraging opportunity.'):i===2?(a.needs.stress>35?b.name+' remains watchful; a quiet screened area supports rest.':b.name+' rests calmly and changes position comfortably.'):(a.round<2?b.name+' explores the prepared '+b.region.toLowerCase()+' habitat cautiously.':b.name+' uses the resting area and activity space confidently.')}
function observeArea(i){if(!admitted())return;if(p().care.length<3){toast('Complete the care plan before recovery assessments.');return}if(p().crisis){toast('Respond to the recovery concern before continuing rounds.');return}if(p().round>=5){toast('Five recovery rounds complete; use Comfort round for further bedside notes.');return}if(!p().observed.includes(i)){p().observed.push(i);journal('Round '+(p().round+1)+' — '+observationNames[i]+': '+observationText(i))}capture(observationText(i));render()}
function advanceRound(){if(!admitted())return;let a=p();if(a.care.length<3||!a.enrichment||!a.habitatReady){toast('Complete care, habitat preparation and enrichment first.');return}if(a.crisis){toast('Resolve the recovery concern first.');return}if(a.round>=5)return;if(a.observed.length<4){toast('Check all four observation areas before advancing.');return}a.round++;a.observed=[];a.health=Math.min(100,a.health+7);a.needs.energy=Math.min(100,a.needs.energy+12);a.needs.appetite=Math.min(100,a.needs.appetite+13);a.needs.mobility=Math.min(100,a.needs.mobility+13);a.needs.stress=Math.max(5,a.needs.stress-8);a.timeline.push({round:a.round,health:a.health,...a.needs});journal('Recovery round '+a.round+' completed; comfort '+a.health+'%.');if(a.round===a.crisisAt&&!a.crisisResolved){a.crisis=true;journal('Recovery concern: '+concernText());toast('A recovery concern appeared. Reassess the habitat.')}save();render()}
function concernText(){return ['owl','eagle','heron'].includes(c().kind)?'A noise near the aviary makes the patient restless and interrupts perching.':c().region==='Wetland'?'Debris has drifted near the bank ramp, making habitat access less comfortable.':'Activity near the resting area interrupts quiet recovery.'}
function resolveConcern(i){if(!p().crisis)return;if(i!==0){journal('Reassessment: advancing activity did not address the habitat concern.');toast('The patient needs its resting environment reassessed first.');render();return}p().crisis=false;p().crisisResolved=true;p().needs.stress=Math.max(5,p().needs.stress-10);journal('Concern resolved: restored a quiet screened habitat and checked safe access.');capture('Reassessment: '+concernText()+' Quiet habitat restored; patient settles.');render()}
function ready(){let a=p();return a.checks.length===8&&a.tests.length===3&&a.diagnosis===rightDx()&&a.care.length===3&&a.habitatReady&&a.enrichment&&a.round>=5&&!a.crisis}
function sendHome(){if(!live())return;let incomplete=!ready();journal((incomplete?'Early sanctuary handover. ':c().specialist?'Continuing specialist-care handover; not cleared for wild release. ':'Recovery complete. ')+'Sent home. Handover: '+(p().handover||'No written handover.')+' Follow-up: '+(p().followup||'None set.')+' Unfinished: '+(8-p().checks.length)+' checks; '+(3-p().tests.length)+' assessments; '+(3-p().care.length)+' care actions; '+Math.max(0,5-p().round)+' rounds.');p().stage='Home';state.released++;tab='Records';save();render();toast(c().name+' sent home. All notes preserved.')}

function stepContent(){let a=p(),b=c(),html='<div class="step-progress">'+a.checks.length+'/8 exam checks · '+a.tests.length+'/3 assessments · '+a.care.length+'/3 care actions · '+a.round+'/5 recovery rounds</div>';
if(b.specialist)html+='<details><summary>Specialist case: '+esc(b.problem)+'</summary><p class="sub">Fictional patient and laboratory results. Specialist care and time are simulated. '+(b.source?'<a href="'+b.source+'" target="_blank" rel="noopener noreferrer">Background reference ↗</a>':'')+'</p></details>';
if(tab==='Intake')return html+'<h2>Admit '+b.name+'</h2><p>'+b.story+'</p><div class="hint"><strong>Reported concern:</strong> '+b.problem+'</div><label for="triage">Arrival priority</label><select id="triage" class="field" data-field="triage"><option '+(a.triage==='Routine'?'selected':'')+'>Routine</option><option '+(a.triage==='Urgent'?'selected':'')+'>Urgent</option></select>'+btn(a.stage==='Home'?'Admit a new visit →':a.stage==='Intake'?'Admit patient & start examination →':'Open current care step →','admitSelected','','primary wide')+btn('Capture rescue story in notes','captureStory','','wide spaced');
if(tab==='Examine'){if(a.stage==='Intake')return html+'<h2>Admission required</h2><p>'+b.name+' is waiting to be admitted.</p>'+btn('Admit patient →','admit','','primary wide');if(a.triage==='Urgent'&&!a.stabilized)return html+'<h2>Urgent arrival stabilization</h2><p>Prepare the quiet protected care space before a close examination.</p>'+btn('Stabilize & begin examination →','stabilize','','primary wide');let missing=areas.findIndex((_,i)=>!a.checks.includes(i));html+='<h2>Eight-part examination</h2>';if(missing>=0)html+='<p>Current check '+(a.checks.length+1)+' of 8</p>'+btn('Check '+areas[missing]+'<span>Reveal this patient’s finding and capture it in the notebook.</span>','check',missing,'action primary wide');else {let testIndex=testNames().findIndex((_,i)=>!a.tests.includes(i));if(testIndex>=0)html+='<h3>Next assessment</h3>'+btn('Run '+testNames()[testIndex]+'<span>Record the assessment result and compare it with your findings.</span>','test',testIndex,'action primary wide');else html+='<h3>Choose the explanation supported by the evidence</h3>'+b.dx.map((x,i)=>btn((a.diagnosis===i?'● ':'○ ')+esc(x),'diagnose',i,'choice action')).join('')+(a.diagnosis===rightDx()?'<div class="hint">Evidence supports your choice.</div>'+btn('Next: prepare care habitat →','tab','Care','primary wide'):'');}html+='<details><summary>Review all examination checks ('+a.checks.length+'/8)</summary>'+areas.map((x,i)=>btn((a.checks.includes(i)?'✓ ':'＋ ')+x+'<span>'+(a.checks.includes(i)?esc(findings(i)):'Not yet examined')+'</span>','check',i,'action wide spaced')).join('')+'</details><details><summary>Review assessment results ('+a.tests.length+'/3)</summary>'+testNames().map((x,i)=>'<div class="entry"><strong>'+x+'</strong><p>'+esc(a.tests.includes(i)?testResult(i):'Not yet assessed')+'</p></div>').join('')+'</details>';return html;}
if(tab==='Care'){html+='<h2>Prepare habitat & care</h2>';if(!a.habitatReady)html+='<p>'+b.name+' needs the '+b.region.toLowerCase()+' care habitat.</p><select id="habitatSelect" class="field" aria-label="Care habitat">'+['Forest','Grassland','Mountain','Wetland'].map(x=>'<option '+(a.habitat===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'+btn('Assign & prepare selected habitat','habitat','','primary wide');else html+='<span class="pill">✓ '+a.habitat+' habitat prepared</span>';let missing=b.care.findIndex((_,i)=>!a.care.includes(i));if(missing>=0)html+='<h3 class="paneltitle">Care action '+(a.care.length+1)+' of 3</h3>'+btn(b.care[missing]+'<span>Complete this action and record the response.</span>','care',missing,'action wide primary');else if(!a.enrichment)html+='<h3 class="paneltitle">Recovery enrichment</h3>'+btn(enrichmentText(),'enrich','','action primary wide');else html+='<div class="hint">Care and enrichment are prepared.</div>'+btn('Begin recovery observations →','tab','Recovery','primary wide');return html+'<details><summary>Full care plan</summary>'+b.care.map((x,i)=>'<p>'+(a.care.includes(i)?'✓ ':'○ ')+x+'</p>').join('')+'</details>';}
if(tab==='Recovery'){html+='<h2>Recovery · '+a.round+' of 5 rounds complete</h2><div class="statsgrid">'+Object.entries({Comfort:a.health,Energy:a.needs.energy,Stress:a.needs.stress}).map(([k,v])=>'<div class="statbox">'+k+' '+v+'%<div class="meter"><i style="width:'+v+'%"></i></div></div>').join('')+'</div>';if(a.crisis)return html+'<div class="hint danger"><strong>Reassessment needed</strong><p>'+concernText()+'</p></div>'+btn('Restore quiet habitat & reassess safe access','concern',0,'primary wide')+btn('Try advancing activity first','concern',1,'wide spaced');if(a.care.length<3||!a.enrichment)return html+'<div class="hint">Finish the care plan and enrichment before starting recovery rounds.</div>'+btn('Return to care plan →','tab','Care','primary wide');if(a.round<5){let i=observationNames.findIndex((_,i)=>!a.observed.includes(i));if(i>=0)html+='<h3 class="paneltitle">Observe '+observationNames[i]+'</h3><p>'+esc(observationText(i))+'</p>'+btn('Record '+observationNames[i].toLowerCase()+' observation →','observe',i,'primary wide');else html+='<div class="hint">Four observations are recorded for this round.</div>'+btn('Complete recovery round '+(a.round+1)+' →','advance','','primary wide');return html+'<p class="sub spaced">This round: '+a.observed.length+'/4 observations recorded. Use the notebook anytime.</p>'+btn('♡ Additional quiet comfort round','comfort','','wide');}return html+'<div class="hint">'+(b.specialist?'Ready for a continuing specialist-care handover. This does not establish a cure or fitness for wild release.':'All recovery rounds are complete. Review the handover before sending home.')+'</div><label for="handover">Send-home handover</label><textarea id="handover" class="field" style="min-height:100px" data-field="handover" placeholder="Care given, recovery changes and remaining needs…">'+esc(a.handover)+'</textarea><label for="followup">Follow-up reminder</label><input id="followup" class="field" data-field="followup" value="'+esc(a.followup)+'" placeholder="Optional follow-up">'+btn('Review send-home checklist →','reviewHome','','primary wide');}
return html+'<h2>'+b.name+'’s case record</h2><div class="hint">Status: '+a.stage+'<br>Habitat: '+esc(a.habitat||'Not assigned')+'<br>Handover: '+esc(a.handover||'Not written')+'<br>Follow-up: '+esc(a.followup||'None set')+'</div>'+btn('Export complete patient report','export','','wide')+'<details><summary>Care history ('+a.log.length+' entries)</summary>'+a.log.map(x=>'<div class="entry">'+esc(x)+'</div>').join('')+'</details><details><summary>Recovery comparison</summary>'+a.timeline.map(x=>'<div class="entry">Round '+x.round+' · comfort '+x.health+'% · mobility '+x.mobility+'% · stress '+x.stress+'%</div>').join('')+'</details>';}
function currentTask(){let a=p();if(a.stage==='Home')return {label:'Choose new admission →',kind:'dispatch'};if(a.stage==='Intake')return {label:'Admit patient →',kind:'admit'};if(a.triage==='Urgent'&&!a.stabilized)return {label:'Stabilize patient →',kind:'stabilize',tab:'Examine'};if(a.crisis)return {label:'Reassess recovery concern →',kind:'reassess',tab:'Recovery'};let i=areas.findIndex((_,i)=>!a.checks.includes(i));if(i>=0)return {label:'Check '+areas[i]+' →',kind:'check',arg:i,tab:'Examine'};i=testNames().findIndex((_,i)=>!a.tests.includes(i));if(i>=0)return {label:'Run next assessment →',kind:'test',arg:i,tab:'Examine'};if(a.diagnosis!==rightDx())return {label:'Choose diagnosis →',kind:'diagnosis',tab:'Examine'};if(!a.habitatReady)return {label:'Prepare '+c().region+' habitat →',kind:'prepareHabitat',tab:'Care'};i=c().care.findIndex((_,i)=>!a.care.includes(i));if(i>=0)return {label:'Complete next care action →',kind:'care',arg:i,tab:'Care'};if(!a.enrichment)return {label:'Prepare recovery enrichment →',kind:'enrich',tab:'Care'};if(a.round<5){i=observationNames.findIndex((_,i)=>!a.observed.includes(i));return i>=0?{label:'Observe '+observationNames[i]+' →',kind:'observe',arg:i,tab:'Recovery'}:{label:'Complete recovery round →',kind:'advance',tab:'Recovery'}}return {label:'Review send-home checklist →',kind:'reviewHome',tab:'Recovery'}}
function setMobileNotes(on){document.body.classList.toggle('notes-open',on);$('notesSwitch').classList.toggle('active',on);$('workSwitch').classList.toggle('active',!on)}
function guide(){if(dispatch){$('guideTitle').textContent='New wildlife admission';$('guideMessage').textContent='Choose Admit now or Urgent admission on an animal below. Examination opens immediately.';$('nextStepButton').textContent='Return to current patient →';$('admitSelected').textContent='Open '+c().name;return}let task=currentTask();$('guideTitle').textContent=c().name+' · '+p().stage;$('guideMessage').textContent=nextStep();$('nextStepButton').textContent=task.label;$('admitSelected').textContent=p().stage==='Home'?'Admit new visit':p().stage==='Intake'?'Admit patient':'Open current step';}
function guidedNext(){setMobileNotes(false);if(dispatch){dispatch=false;tab=p().stage==='Intake'?'Intake':currentTask().tab||'Records';render();return}let t=currentTask();dispatch=false;if(t.tab)tab=t.tab;if(t.kind==='dispatch'){dispatch=true;render();return}if(t.kind==='diagnosis'||t.kind==='reassess'){render();$('work').scrollIntoView({block:'nearest',behavior:'smooth'});return}if(t.kind==='prepareHabitat'){p().habitat=c().region;p().habitatReady=true;journal('Prepared '+c().region.toLowerCase()+' care habitat.');render();return}let fn=actions[t.kind];if(fn)fn(t.arg);else render();}
function render(){let a=p(),b=c();$('score').textContent=state.patients.filter(x=>x.stage!=='Home').length+' active · '+state.released+' sent home · '+cases.length+' cases';$('patients').innerHTML=state.patients.map((x,i)=>btn('<span class="avatar">'+cases[x.case].icon+'</span><strong>'+cases[x.case].name+'</strong><small>'+cases[x.case].species+' · '+x.stage+(x.triage==='Urgent'?' · URGENT':'')+'</small>','select',i,'patient '+(i===state.selected?'active':''))).join('');$('species').textContent=b.region+' / '+b.species+' / '+b.location;$('name').textContent=b.name;$('status').textContent=a.stage;$('tank').className='ocean '+b.habitat;$('tank').innerHTML='<div class="waterlabel">WILDHAVEN · '+b.region.toUpperCase()+' CARE HABITAT</div><div class="seabed"></div>'+animal(b.kind)+(tab==='Examine'&&!dispatch?[['Head',33,35],['Body',50,55],['Movement',68,70],['Habitat',84,30]].map((x,i)=>'<button type="button" class="bodypin" data-act="check" data-arg="'+i+'" aria-label="Check '+x[0]+'" style="left:'+x[1]+'%;top:'+x[2]+'%">'+(a.checks.includes(i)?'✓':'+')+'</button>').join(''):'');$('tabs').innerHTML=['Intake','Examine','Care','Recovery','Records'].map(x=>btn(x,'tab',x,!dispatch&&tab===x?'active':'')).join('');$('notetitle').textContent=b.name+' · independent patient notes';renderNotebook();$('journal').innerHTML=a.log.length?a.log.slice(0,40).map(x=>'<div class="entry">'+esc(x)+'</div>').join(''):'<p class="sub">Admit this patient to start the care journal.</p>';$('work').innerHTML=dispatch?dispatchContent():stepContent();guide();save();}

const noteCategories=['All notes','Intake','Examination','Care','Recovery','Handover'];
const draftFields=['Appetite & drinking','Breathing','Movement & balance','Behavior & comfort','Visible changes','Care given & response','My next check'];

let notebookView='Write';
function renderNotebook(){let a=p();$('noteTools').innerHTML='<div class="noteviews">'+['Write','Observe','Checks','History'].map(x=>btn(x,'notebookView',x,'mini '+(notebookView===x?'active':''))).join('')+'</div><select id="noteCategory" class="field" aria-label="Note category" data-notecategory="true">'+noteCategories.map(x=>'<option '+(x===noteCategory?'selected':'')+'>'+x+'</option>').join('')+'</select>';
$('notes').hidden=notebookView!=='Write';$('notes').value=noteCategory==='All notes'?a.notes:a.noteSections[noteCategory]||'';$('notes').dataset.field='notebookText';$('notes').placeholder='Write '+c().name+'’s '+noteCategory.toLowerCase()+'…';let html='';if(notebookView==='Write')html='<div class="cards">'+btn('Insert editable template','noteTemplate','','mini')+btn('Capture current summary','noteSummary','','mini')+'</div><details><summary>Quick observation stamps</summary><div class="cards">'+['Bright & alert','Quiet & resting','Food interest improving','Movement improving','Unchanged — recheck','Concern — reassess'].map((x,i)=>btn(x,'noteStamp',i,'mini')).join('')+'</div></details><label class="sub"><input id="autoNotes" type="checkbox" '+(a.autoNotes?'checked':'')+'> Capture admissions and concerns automatically</label>';
if(notebookView==='Observe')html='<h3>Detailed observation form</h3><p class="sub">Save any observations without advancing recovery time.</p>'+draftFields.map((x,i)=>'<label for="draft'+i+'">'+x+'</label><textarea id="draft'+i+'" class="field" data-draft="'+i+'" rows="2">'+esc(a.observationDraft[i]||'')+'</textarea>').join('')+btn('Save observation to notes','saveObservation','','primary wide');
if(notebookView==='Checks')html='<h3>My next checks</h3><input class="field" data-field="todoDraft" value="'+esc(a.todoDraft||'')+'" placeholder="My next patient check" aria-label="New patient check">'+btn('Add patient check','addTodo','','wide')+a.todos.map((x,i)=>'<div class="row checklist">'+btn((x.done?'☑ ':'☐ ')+esc(x.text),'toggleTodo',i,'mini')+btn('Remove','removeTodo',i,'mini')+'</div>').join('');
if(notebookView==='History')html='<h3>Captured note history</h3>'+a.noteEntries.map((e,i)=>'<div class="entry"><strong>'+esc(e.category)+'</strong> · '+esc(e.at)+'<p>'+esc(e.text)+'</p>'+btn('Copy to current note category','recopyNote',i,'mini')+'</div>').join('');$('noteExtras').innerHTML='<div class="note-section">'+html+'</div>';}
function noteTemplate(){let templates={'All notes':'OBSERVATION\nTime / setting:\nWhat I saw:\nWhat I checked:\nAction and response:\nNext check:',Intake:'RESCUE INTAKE\nFound at: '+c().location+'\nArrival priority: '+p().triage+'\nReported story: '+c().story+'\nMy first observations:\nPlanned next check:',Examination:'EXAMINATION NOTE\nPresenting concern: '+c().problem+'\nHead / breathing:\nBody / surface:\nMovement / balance:\nFindings that support my explanation:\nFindings still uncertain:',Care:'CARE NOTE\nWorking explanation:\nHabitat prepared:\nAction performed:\nImmediate response:\nComfort provided:\nNext assessment:',Recovery:'RECOVERY NOTE\nRound: '+(p().round+1)+'\nAppetite / drinking:\nBreathing:\nMovement:\nBehavior / rest:\nBetter / unchanged / worse:\nNext check:',Handover:'SANCTUARY HANDOVER\nReason for admission: '+c().problem+'\nCare completed:\nRecovery observations:\nUnfinished checks:\nHabitat and comfort needs:\nFollow-up:'};appendNote(templates[noteCategory],noteCategory==='All notes'?noteSection():noteCategory);renderNotebook();toast('Editable note template inserted.')}
function summaryNote(){appendNote(c().name+' — '+c().species+'\nStatus: '+p().stage+' / '+p().triage+'\nConcern: '+c().problem+'\nChecks: '+p().checks.length+'/8; assessments: '+p().tests.length+'/3; care: '+p().care.length+'/3; recovery: '+p().round+'/5.\nHabitat: '+(p().habitat||'Unassigned')+'\nNext: '+nextStep());renderNotebook();toast('Current case summary captured.')}
function saveObservation(){let text=draftFields.map((x,i)=>p().observationDraft[i]?x+': '+p().observationDraft[i]:'').filter(Boolean).join('\n');if(!text){toast('Write at least one observation first.');return}appendNote('BEDSIDE OBSERVATION\n'+text);p().observationDraft={};journal('Detailed bedside observation saved.');renderNotebook();toast('Observation saved without advancing time.')}
function dispatchContent(){return '<div class="eyebrow">Wildlife admissions desk</div><h2 class="spaced">Admit a wildlife patient</h2><p>Choose an animal below. <strong>Admit now</strong> opens examination directly. Existing active visits reopen safely.</p><div class="tabs" style="flex-wrap:wrap">'+['All','Unusual cases','Forest','Grassland','Mountain','Wetland'].map(x=>btn(x,'region',x,region===x?'active':'')).join('')+'</div><div class="dispatchgrid">'+cases.map((b,i)=>({b,i})).filter(({b})=>region==='All'||(region==='Unusual cases'?b.specialist:b.region===region)).map(({b,i})=>'<div class="mission"><h3>'+b.icon+' '+b.name+' · '+b.species+'</h3><p class="sub">'+b.region+' / '+b.location+'</p><p>'+b.problem+'</p>'+btn('Admit now →','admitCase',i,'primary wide')+btn('Urgent admission →','urgentCase',i,'wide spaced')+'</div>').join('')+'</div>'}
function admitCase(i,urgent=false){if(!cases[i])return;let index=state.patients.findIndex(x=>x.case===i&&x.stage!=='Home');if(index<0){state.patients.push(fresh(i));index=state.patients.length-1}state.selected=index;if(urgent)p().triage='Urgent';admitPatient()}
function reviewHome(){if(!live())return;$('work').innerHTML='<h2>Send-home review</h2><p>'+c().name+'’s notes and full care history will remain available.</p><div class="hint">'+nextStep()+'<br>Examination: '+p().checks.length+'/8<br>Assessments: '+p().tests.length+'/3<br>Care: '+p().care.length+'/3<br>Recovery: '+p().round+'/5<br>Handover: '+esc(p().handover||'Not written')+'<br>Follow-up: '+esc(p().followup||'None')+'</div>'+btn(ready()?'Send home':'Confirm early sanctuary handover','sendHome','','primary wide')+btn('Keep caring for this patient','tab','Recovery','wide spaced')}
function dl(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCase(){let a=p();dl(c().name+'-Wildlife-Case.txt',c().name+' — '+c().species+'\n'+a.stage+' / '+a.triage+'\n\n'+c().story+'\n\nNOTES\n'+a.notes+'\n\nNOTE SECTIONS\n'+Object.entries(a.noteSections).map(([k,v])=>k.toUpperCase()+'\n'+v).join('\n\n')+'\n\nMY NEXT CHECKS\n'+a.todos.map(x=>(x.done?'[done] ':'[open] ')+x.text).join('\n')+'\n\nHANDOVER\n'+a.handover+'\nFOLLOW-UP\n'+a.followup+'\n\nRECOVERY TIMELINE\n'+a.timeline.map(x=>'Round '+x.round+': comfort '+x.health+'%; mobility '+x.mobility+'%; stress '+x.stress+'%').join('\n')+'\n\nJOURNAL\n'+a.log.join('\n'),'text/plain')}
function downloadGame(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#toast').hidden=true;clone.querySelector('#notes').textContent='';dl('Wildlife-Vet-Assist-Guided.html','<!doctype html>'+clone.outerHTML,'text/html')}
function readPatient(){if(!('speechSynthesis' in window)){toast('Read aloud is unavailable in this browser.');return}if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();return}window.speechSynthesis.speak(new SpeechSynthesisUtterance(c().name+'. '+c().story+'. '+nextStep()+'. '+(noteCategory==='All notes'?p().notes:p().noteSections[noteCategory]||'No notes in this section yet.')))}
const actions={next:guidedNext,showNotes:()=>setMobileNotes(true),showWork:()=>setMobileNotes(false),notebookView:x=>{notebookView=x;renderNotebook()},admitSelected:()=>{setMobileNotes(false);admitPatient()},noteCategory:x=>{noteCategory=x;renderNotebook()},noteTemplate,noteSummary:summaryNote,noteStamp:x=>{let texts=['Bright and alert during this bedside observation.','Quiet and resting in the protected habitat.','Food interest appears to be improving during this observation.','Movement appears more comfortable during this observation.','No clear change observed; plan a repeat check.','A concern was observed; reassessment is planned.'];appendNote(texts[Number(x)]);renderNotebook();toast('Observation stamped.')},saveObservation,addTodo:()=>{let text=(p().todoDraft||'').trim();if(!text){toast('Write the next check first.');return}p().todos.push({text,done:false});p().todoDraft='';save();renderNotebook()},toggleTodo:x=>{p().todos[Number(x)].done=!p().todos[Number(x)].done;save();renderNotebook()},removeTodo:x=>{p().todos.splice(Number(x),1);save();renderNotebook()},recopyNote:x=>{let entry=p().noteEntries[Number(x)];appendNote(entry.text);renderNotebook()},dispatch:()=>{setMobileNotes(false);dispatch=true;render()},region:x=>{region=x;dispatch=true;render()},select:x=>selectPatient(Number(x)),tab:x=>{tab=x;dispatch=false;render()},admit:admitPatient,admitCase:x=>admitCase(Number(x)),urgentCase:x=>admitCase(Number(x),true),check:x=>check(Number(x)),test:x=>runTest(Number(x)),diagnose:x=>diagnose(Number(x)),habitat:chooseHabitat,care:x=>care(Number(x)),enrich,comfort,observe:x=>observeArea(Number(x)),advance:advanceRound,concern:x=>resolveConcern(Number(x)),reviewHome,sendHome,captureStory:()=>capture(c().story),export:exportCase,download:downloadGame,read:readPatient,stabilize:()=>{if(!admitted())return;p().stabilized=true;journal('Urgent stabilization completed: quiet protected habitat; patient ready for gentle examination.');render()},backup:()=>dl('Wildlife-Patients-Backup.json',JSON.stringify(state,null,2),'application/json'),restore:()=>$('restorefile').click()};
document.addEventListener('click',ev=>{let button=ev.target.closest?.('[data-act]');if(!button||button.disabled)return;let fn=actions[button.dataset.act];if(fn)try{fn(button.dataset.arg)}catch(err){console.error(err);$('guideMessage').textContent='This step did not finish. Open the current patient step or choose a new admission; your notes are preserved.';toast('Step interrupted. Your notes are preserved.')}});
document.addEventListener('input',ev=>{let field=ev.target.dataset.field;if(field==='notebookText'){if(noteCategory==='All notes')p().notes=ev.target.value;else p().noteSections[noteCategory]=ev.target.value;save()}else if(['handover','followup','todoDraft'].includes(field)){p()[field]=ev.target.value;save()}if(ev.target.dataset.draft!==undefined){p().observationDraft[ev.target.dataset.draft]=ev.target.value;save()}});
document.addEventListener('change',ev=>{if(ev.target.dataset.notecategory){noteCategory=ev.target.value;renderNotebook()}if(ev.target.dataset.field==='triage'){p().triage=ev.target.value;save()}if(ev.target.id==='autoNotes'){p().autoNotes=ev.target.checked;save()}});
$('restorefile').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.patients)||!data.patients.length||data.patients.some(a=>!a||!Number.isInteger(a.case)||!cases[a.case]||typeof a.notes!=='string'))throw Error('Invalid backup');state={...data,patients:data.patients.map(normalize),selected:0,released:data.patients.filter(a=>a.stage==='Home').length};tab='Intake';dispatch=false;save();render();toast('Patient backup restored.')}catch{toast('That file is not a valid wildlife patient backup.')}ev.target.value=''});
render();

</script></body></html>
